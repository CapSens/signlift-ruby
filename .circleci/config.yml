version: 2.1

orbs:
  ruby: circleci/ruby@2.0.1

jobs:
  spec:
    docker:
      - image: cimg/ruby:3.4
    steps:
      - checkout
      - ruby/install-deps:
          bundler-version: 2.7.2
          path: "$GEM_HOME"
          with-cache: false
      - run:
          name: "Run RSpec test suite"
          command: "bundle exec rake spec"

workflows:
  version: 2
  test:
    jobs:
      - spec
